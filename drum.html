<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Тук-Тук — ночной барабанчик 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0d1030; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #title, #hint { position: fixed; left: 0; right: 0; text-align: center; pointer-events: none; text-shadow: 0 2px 6px rgba(0,0,0,.6); }
  #title { top: 16px; color: #ffe9b0; font-size: 22px; font-weight: 700; }
  #hint { bottom: 16px; color: #dfe4ff; font-size: 14px; padding: 0 16px; }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="title">Тук-Тук, ночной барабанчик</div>
<div id="hint">Тяни мышкой или пальцем — вращение · колёсико — масштаб · клик по Тук-Туку — барабанная дробь со звуком</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x10143a);
scene.fog = new THREE.Fog(0x10143a, 14, 38);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(-3.4, 2.8, 8.6);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.9, 0);
controls.enableDamping = true;
controls.minDistance = 4;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI / 2 - 0.03;

// ---------- свет ----------
scene.add(new THREE.HemisphereLight(0x8fa4ff, 0x2b2238, 0.9));
const moonLight = new THREE.DirectionalLight(0xcfd8ff, 1.5);
moonLight.position.set(-5, 9, 5);
moonLight.castShadow = true;
moonLight.shadow.mapSize.set(2048, 2048);
moonLight.shadow.camera.left = -6; moonLight.shadow.camera.right = 6;
moonLight.shadow.camera.top = 6; moonLight.shadow.camera.bottom = -6;
scene.add(moonLight);

const rnd = (a, b) => a + Math.random() * (b - a);
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...o });
const mesh = (geo, material, parent, x = 0, y = 0, z = 0) => {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
};

// ---------- текстуры (рисуются на canvas) ----------
function canvasTex(w, h, draw) {
  const c = document.createElement('canvas');
  c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  t.wrapS = t.wrapT = THREE.RepeatWrapping;
  return t;
}
const woodTex = canvasTex(512, 512, (g, w, h) => {
  g.fillStyle = '#c98d4b'; g.fillRect(0, 0, w, h);
  for (let i = 0; i < 140; i++) {
    g.strokeStyle = `rgba(${90 + rnd(0, 50) | 0},${50 + rnd(0, 30) | 0},20,${rnd(0.08, 0.3)})`;
    g.lineWidth = rnd(1, 4);
    const x = rnd(0, w);
    g.beginPath(); g.moveTo(x, 0);
    g.bezierCurveTo(x + rnd(-14, 14), h * 0.33, x + rnd(-14, 14), h * 0.66, x, h);
    g.stroke();
  }
});
const sarongTex = canvasTex(256, 256, (g, w, h) => {
  g.fillStyle = '#1f7a5c'; g.fillRect(0, 0, w, h);
  g.fillStyle = 'rgba(255,220,120,.85)';
  for (let i = 0; i < 4; i++) { g.fillRect(i * 64 + 26, 0, 12, h); g.fillRect(0, i * 64 + 26, w, 12); }
  g.fillStyle = 'rgba(140,20,40,.7)';
  for (let i = 0; i < 4; i++) { g.fillRect(i * 64 + 2, 0, 5, h); g.fillRect(0, i * 64 + 2, w, 5); }
});
sarongTex.repeat.set(4, 1);

const M = {
  wood: mat(0xffffff, { map: woodTex, roughness: 0.65 }),
  woodDark: mat(0x7a4a22, { roughness: 0.8 }),
  lid: mat(0xb9803f),
  hollow: mat(0x2a1608, { roughness: 1 }),
  white: mat(0xffffff, { roughness: 0.3 }),
  iris: mat(0x6b3d1a, { roughness: 0.3 }),
  black: mat(0x17171d, { roughness: 0.45 }),
  cheek: mat(0xe8704f),
  mouth: mat(0x5a1a14),
  sarong: mat(0xffffff, { map: sarongTex, roughness: 0.9 }),
  cap: mat(0x1c1c24, { roughness: 0.9 }),
  capTrim: mat(0xe2b93b, { roughness: 0.4, metalness: 0.4 }),
  sandal: mat(0x8a4b2a),
  rope: mat(0xd9c08a, { roughness: 1 }),
  ground: mat(0x3b3550, { roughness: 1 }),
};

// ---------- персонаж ----------
const hero = new THREE.Group();
scene.add(hero);
const torso = new THREE.Group();
torso.position.y = 2.2;
hero.add(torso);

// корпус: пузатый деревянный барабан-кентонган
const R = 0.95, H = 2.4;
const profile = [];
for (let i = 0; i <= 20; i++) {
  const k = i / 20;                       // 0 = низ, 1 = верх
  const bulge = Math.sin(k * Math.PI) * 0.22;
  const edge = Math.min(1, Math.min(k, 1 - k) * 14); // скругление торцов
  profile.push(new THREE.Vector2((R - 0.22 + bulge) * (0.82 + 0.18 * edge), (k - 0.5) * H));
}
profile.unshift(new THREE.Vector2(0, -H / 2));
profile.push(new THREE.Vector2(0, H / 2));
mesh(new THREE.LatheGeometry(profile, 48), M.wood, torso);

// резные пояски
for (const y of [0.98, -0.2]) {
  const r = R - 0.22 + Math.sin((y / H + 0.5) * Math.PI) * 0.22;
  const band = mesh(new THREE.TorusGeometry(r + 0.01, 0.05, 12, 48), M.woodDark, torso, 0, y, 0);
  band.rotation.x = Math.PI / 2;
}

// прорезь-резонатор на животе
const slit = mesh(new THREE.CapsuleGeometry(0.075, 0.42, 6, 12), M.hollow, torso, 0, -0.62, 0.86);
slit.scale.z = 0.4; slit.castShadow = false;

// лицо
const face = new THREE.Group();
face.position.set(0, 0.42, 0.885);
torso.add(face);
const eyes = [];
for (const sx of [-1, 1]) {
  const eye = new THREE.Group();
  eye.position.set(sx * 0.33, 0.08, 0);
  eye.rotation.y = sx * 0.3;
  face.add(eye);
  mesh(new THREE.SphereGeometry(0.24, 32, 24), M.white, eye).scale.z = 0.5;
  mesh(new THREE.SphereGeometry(0.12, 24, 16), M.iris, eye, 0, -0.02, 0.1).scale.z = 0.4;
  mesh(new THREE.SphereGeometry(0.065, 24, 16), M.black, eye, 0, -0.02, 0.135).scale.z = 0.4;
  mesh(new THREE.SphereGeometry(0.025, 10, 8), M.white, eye, 0.04, 0.03, 0.16).castShadow = false;
  // сонное веко
  const lid = mesh(new THREE.SphereGeometry(0.25, 24, 16, 0, Math.PI * 2, 0, Math.PI * 0.38), M.lid, eye, 0, 0, 0.005);
  lid.scale.z = 0.56;
  const brow = mesh(new THREE.CapsuleGeometry(0.04, 0.22, 6, 12), M.woodDark, eye, 0, 0.36, 0.02);
  brow.rotation.z = Math.PI / 2 - sx * 0.22;
  const cheek = mesh(new THREE.SphereGeometry(0.11, 16, 12), M.cheek, eye, sx * 0.2, -0.32, -0.05);
  cheek.scale.z = 0.3; cheek.castShadow = false;
  eyes.push(eye);
}
// нос-сучок и улыбка
mesh(new THREE.SphereGeometry(0.09, 16, 12), M.woodDark, face, 0, -0.14, 0.06);
const smile = mesh(new THREE.TorusGeometry(0.2, 0.035, 10, 24, Math.PI * 0.8), M.mouth, face, 0, -0.22, 0.07);
smile.rotation.z = Math.PI + Math.PI * 0.1;
smile.castShadow = false;

// шапочка-печи
const cap = new THREE.Group();
cap.position.y = H / 2 - 0.06;
cap.rotation.z = 0.08;
torso.add(cap);
mesh(new THREE.CylinderGeometry(0.5, 0.56, 0.42, 32), M.cap, cap, 0, 0.21, 0).scale.z = 0.8;
const trim = mesh(new THREE.TorusGeometry(0.555, 0.025, 8, 32), M.capTrim, cap, 0, 0.04, 0);
trim.rotation.x = Math.PI / 2; trim.scale.y = 0.8;

// саронг
const sarong = mesh(new THREE.CylinderGeometry(0.93, 1.02, 0.85, 40, 1, true), M.sarong, torso, 0, -0.95, 0);
sarong.material.side = THREE.DoubleSide;
const knot = mesh(new THREE.SphereGeometry(0.13, 16, 12), M.sarong, torso, 0.3, -0.55, 0.9);
knot.scale.set(1.3, 0.8, 0.7);
const belt = mesh(new THREE.TorusGeometry(0.94, 0.04, 8, 40), M.rope, torso, 0, -0.55, 0);
belt.rotation.x = Math.PI / 2;

// руки
function makeArm(sx) {
  const shoulder = new THREE.Group();
  shoulder.position.set(sx * 0.98, 0.1, 0);
  torso.add(shoulder);
  mesh(new THREE.CapsuleGeometry(0.075, 0.8, 6, 14), M.woodDark, shoulder, 0, -0.47, 0);
  const hand = mesh(new THREE.SphereGeometry(0.16, 20, 16), M.wood, shoulder, 0, -0.98, 0);
  return { shoulder, hand };
}
const armL = makeArm(-1), armR = makeArm(1);
armL.shoulder.rotation.z = -0.35;

// колотушка в правой руке
const mallet = new THREE.Group();
armR.hand.add(mallet);
mallet.rotation.x = Math.PI / 2;
mesh(new THREE.CylinderGeometry(0.035, 0.035, 0.9, 12), M.woodDark, mallet, 0, 0.35, 0);
mesh(new THREE.SphereGeometry(0.15, 20, 16), M.rope, mallet, 0, 0.85, 0);

// ноги
function makeLeg(sx) {
  const hip = new THREE.Group();
  hip.position.set(sx * 0.38, 2.2 - H / 2 - 0.1, 0);
  hero.add(hip);
  mesh(new THREE.CapsuleGeometry(0.08, 0.5, 6, 14), M.woodDark, hip, 0, -0.35, 0);
  const foot = mesh(new THREE.SphereGeometry(0.22, 20, 14), M.wood, hip, 0, -0.75, 0.1);
  foot.scale.set(1, 0.55, 1.5);
  const sole = mesh(new THREE.CylinderGeometry(0.25, 0.25, 0.06, 24), M.sandal, hip, 0, -0.87, 0.1);
  sole.scale.set(1, 1, 1.55);
  return hip;
}
const legL = makeLeg(-1), legR = makeLeg(1);

// ---------- окружение ----------
const ground = new THREE.Mesh(new THREE.CircleGeometry(34, 64), M.ground);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// месяц
const moon = new THREE.Group();
moon.position.set(-9, 11, -16);
scene.add(moon);
const moonMat = new THREE.MeshBasicMaterial({ color: 0xfff1c2, fog: false });
moon.add(new THREE.Mesh(new THREE.SphereGeometry(1.6, 32, 24), moonMat));
const moonCut = new THREE.Mesh(new THREE.SphereGeometry(1.45, 32, 24), new THREE.MeshBasicMaterial({ color: 0x10143a, fog: false }));
moonCut.position.set(0.75, 0.35, 0.9);
moon.add(moonCut);

// звёзды
const starPos = [];
for (let i = 0; i < 500; i++) {
  const a = rnd(0, Math.PI * 2), e = rnd(0.12, 1.4), r = 34;
  starPos.push(Math.cos(a) * Math.cos(e) * r, Math.sin(e) * r, Math.sin(a) * Math.cos(e) * r);
}
const starGeo = new THREE.BufferGeometry();
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xffffff, size: 0.14, fog: false })));

// домики с тёплыми окнами
const houseMat = mat(0x4a4468), roofMat = mat(0x7a3b3b), winMat = new THREE.MeshBasicMaterial({ color: 0xffc766 });
for (const [x, z, s, ry] of [[-6, -7, 1.3, 0.3], [5.5, -8, 1.6, -0.25], [0.5, -11, 1.2, 0], [9, -4, 1.1, -0.7]]) {
  const h = new THREE.Group();
  h.position.set(x, 0, z); h.scale.setScalar(s); h.rotation.y = ry;
  mesh(new THREE.BoxGeometry(2.4, 1.8, 2), houseMat, h, 0, 0.9, 0);
  const roof = mesh(new THREE.ConeGeometry(2.1, 1.2, 4), roofMat, h, 0, 2.4, 0);
  roof.rotation.y = Math.PI / 4;
  for (const wx of [-0.6, 0.6]) {
    const win = new THREE.Mesh(new THREE.PlaneGeometry(0.5, 0.6), winMat);
    win.position.set(wx, 1, 1.01);
    h.add(win);
  }
  scene.add(h);
}

// фонарики на столбах
const lanterns = [];
for (const [x, z, c] of [[-2.8, -1.2, 0xff9d3b], [3, -1.6, 0xffd34d]]) {
  const post = new THREE.Group();
  post.position.set(x, 0, z);
  mesh(new THREE.CylinderGeometry(0.06, 0.08, 3.2, 10), M.woodDark, post, 0, 1.6, 0);
  const lamp = new THREE.Mesh(new THREE.SphereGeometry(0.28, 20, 16), new THREE.MeshBasicMaterial({ color: c }));
  lamp.position.set(0, 3.3, 0); lamp.scale.y = 1.25;
  post.add(lamp);
  const light = new THREE.PointLight(c, 14, 9, 2);
  light.position.set(0, 3.3, 0);
  post.add(light);
  lanterns.push(light);
  scene.add(post);
}

// светлячки
const flies = [];
const flyMat = new THREE.MeshBasicMaterial({ color: 0xe9ff8a });
for (let i = 0; i < 30; i++) {
  const f = new THREE.Mesh(new THREE.SphereGeometry(0.035, 8, 6), flyMat);
  f.userData = { c: new THREE.Vector3(rnd(-7, 7), rnd(0.5, 4), rnd(-6, 4)), p: rnd(0, 6), s: rnd(0.4, 1) };
  scene.add(f); flies.push(f);
}

// ---------- звук ----------
let audio = null;
function knock(pitch = 1) {
  if (!audio) return;
  const t = audio.currentTime;
  for (const [f, g, d] of [[520 * pitch, 0.5, 0.12], [1040 * pitch, 0.18, 0.05]]) {
    const o = audio.createOscillator(), v = audio.createGain();
    o.type = 'sine';
    o.frequency.setValueAtTime(f, t);
    o.frequency.exponentialRampToValueAtTime(f * 0.8, t + d);
    v.gain.setValueAtTime(g, t);
    v.gain.exponentialRampToValueAtTime(0.001, t + d);
    o.connect(v).connect(audio.destination);
    o.start(t); o.stop(t + d);
  }
}

// ---------- взаимодействие ----------
let rollT = -1;            // барабанная дробь по клику
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  if (!ray.intersectObject(hero, true).length) return;
  try { audio ??= new (window.AudioContext || window.webkitAudioContext)(); audio.resume(); } catch {}
  if (rollT < 0) rollT = 0;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- анимация ----------
const clock = new THREE.Clock();
let beatPhase = 0, squash = 0;
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // темп ударов: спокойный, а во время дроби — быстрый
  const rolling = rollT >= 0;
  if (rolling) { rollT += dt; if (rollT > 2.2) rollT = -1; }
  const tempo = rolling ? 7 : 1.6;         // ударов в секунду
  const prev = beatPhase;
  beatPhase = (beatPhase + dt * tempo) % 1;
  if (beatPhase < prev) { squash = 1; knock(rolling ? rnd(0.9, 1.25) : 1); }
  squash *= Math.pow(0.002, dt);

  // рука с колотушкой: замах и удар по боку
  const swing = Math.pow(Math.sin(beatPhase * Math.PI), 0.6);
  armR.shoulder.rotation.z = 0.25 + swing * 1.0;
  armR.shoulder.rotation.x = -0.55;
  mallet.rotation.z = 1.3 - swing * 0.8;

  // корпус пружинит от удара
  const breathe = Math.sin(t * 2) * 0.012;
  torso.scale.set(1 + breathe + squash * 0.05, 1 - breathe - squash * 0.05, 1 + breathe + squash * 0.05);
  torso.position.y = 2.2 + Math.sin(t * 2) * 0.03;
  torso.rotation.z = Math.sin(t * 1.2) * 0.03 - squash * 0.05;

  // шаг на месте
  const step = Math.sin(t * (rolling ? 12 : 3.2));
  legL.rotation.x = step * (rolling ? 0.5 : 0.18);
  legR.rotation.x = -step * (rolling ? 0.5 : 0.18);
  hero.position.y = rolling ? Math.abs(step) * 0.12 : 0;
  armL.shoulder.rotation.x = -step * 0.25;

  // моргание
  const blink = (t % 3.8) < 0.13 ? 0.08 : 1;
  for (const e of eyes) e.scale.y += (blink - e.scale.y) * 0.5;

  // фонарики мерцают, светлячки летают
  lanterns.forEach((l, i) => { l.intensity = 14 + Math.sin(t * 9 + i * 2) * 1.5; });
  for (const f of flies) {
    const { c, p, s } = f.userData;
    f.position.set(c.x + Math.sin(t * s + p) * 0.8, c.y + Math.sin(t * s * 1.7 + p) * 0.4, c.z + Math.cos(t * s + p) * 0.8);
    f.visible = Math.sin(t * 2 * s + p) > -0.5;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
