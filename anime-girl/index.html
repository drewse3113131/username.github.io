<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { GLTFExporter } from 'three/addons/exporters/GLTFExporter.js';
import { mergeVertices, mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

// ---------- palette ----------
const C = {
  skin: 0xffece3, hair: 0xf5a3c0, hairDark: 0xe07fa6, dress: 0x33283f, white: 0xffffff,
  rose: 0xe0457b, gold: 0xf2c14e, earIn: 0xffd3e0, shoe: 0x2a2033,
};

// ---------- renderer / scene ----------
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.appendChild(renderer.domElement);
const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(32, 1, 0.05, 50);
camera.position.set(0.9, 1.15, 3.6);
const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 0.84, 0);
controls.enableDamping = true;
controls.minDistance = 0.8; controls.maxDistance = 7;
controls.autoRotate = true; controls.autoRotateSpeed = 1.6;

scene.add(new THREE.HemisphereLight(0xffffff, 0xd9c2d6, 1.5));
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.position.set(1.5, 3, 3.5);
scene.add(sun);

// ---------- materials ----------
const ramp = new THREE.DataTexture(new Uint8Array([170, 228, 255]), 3, 1, THREE.RedFormat);
ramp.minFilter = ramp.magFilter = THREE.NearestFilter; ramp.needsUpdate = true;
const mats = {};
const skinRamp = new THREE.DataTexture(new Uint8Array([232, 250, 255]), 3, 1, THREE.RedFormat);
skinRamp.minFilter = skinRamp.magFilter = THREE.NearestFilter; skinRamp.needsUpdate = true;
const toon = (color, side = THREE.FrontSide) => {
  const k = color + ':' + side;
  return mats[k] ??= new THREE.MeshToonMaterial({ color, gradientMap: color === C.skin ? skinRamp : ramp, side });
};
const outlineMat = new THREE.ShaderMaterial({
  side: THREE.BackSide,
  uniforms: { t: { value: 0.0032 } },
  vertexShader: `#include <common>
    #include <skinning_pars_vertex>
    uniform float t;
    void main(){
      #include <skinbase_vertex>
      vec3 transformed = position + normalize(normal) * t;
      #include <skinning_vertex>
      #include <project_vertex>
    }`,
  fragmentShader: 'void main(){ gl_FragColor = vec4(0.16, 0.09, 0.14, 1.0); }',
});

const character = new THREE.Group(); character.name = 'Hana';
scene.add(character);
const outlines = [];

function add(parent, geo, color, { outline = true, side = THREE.FrontSide, name } = {}) {
  const m = new THREE.Mesh(geo, typeof color === 'number' ? toon(color, side) : color);
  if (name) m.name = name;
  parent.add(m);
  m.userData.outline = outline;
  return m;
}

// ---------- geometry helpers ----------
const V2 = (x, y) => new THREE.Vector2(x, y);
const V3 = (x, y, z) => new THREE.Vector3(x, y, z);
const sphere = (sx, sy, sz, seg = 24) => new THREE.SphereGeometry(1, seg, Math.round(seg * 0.7)).scale(sx, sy, sz);
const lathe = (pts, seg = 40, a0 = 0, len = Math.PI * 2) => new THREE.LatheGeometry(pts.map(p => V2(p[0], p[1])), seg, a0, len);

// parametric surface: fn(u, v) -> Vector3, u wraps if closed
function grid(nu, nv, fn, flip = false) {
  const pos = [], idx = [];
  for (let j = 0; j <= nv; j++) for (let i = 0; i <= nu; i++) { const p = fn(i / nu, j / nv); pos.push(p.x, p.y, p.z); }
  for (let j = 0; j < nv; j++) for (let i = 0; i < nu; i++) {
    const a = j * (nu + 1) + i, b = a + 1, c = a + nu + 1, d = c + 1;
    if (flip) idx.push(a, c, b, b, c, d); else idx.push(a, b, c, b, d, c);
  }
  let g = new THREE.BufferGeometry();
  g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  g.setIndex(idx);
  g = mergeVertices(g, 1e-5);
  g.computeVertexNormals();
  return g;
}

// tapered tube along a curve; ref = point the flat side faces away from
function strand(pts, rFn, { flat = 1, ref = V3(0, 0, 0), segs = 22, radial = 10 } = {}) {
  const curve = new THREE.CatmullRomCurve3(pts);
  return grid(radial, segs, (u, v) => {
    const p = curve.getPoint(v), t = curve.getTangent(v);
    const n = p.clone().sub(ref); n.addScaledVector(t, -n.dot(t)).normalize();
    const b = new THREE.Vector3().crossVectors(t, n);
    const r = rFn(v), a = -u * Math.PI * 2;
    return p.addScaledVector(b, Math.cos(a) * r).addScaledVector(n, Math.sin(a) * r * flat);
  });
}

// ruffle ribbon around the Y axis
function frill({ r, y = 0, w = 0.04, drop = 0.03, waves = 24, amp = 0.012, a0 = 0, a1 = Math.PI * 2, zs = 1 }) {
  const full = Math.abs(a1 - a0 - Math.PI * 2) < 1e-6;
  const n = Math.max(8, Math.round(waves * 8 * (a1 - a0) / (Math.PI * 2)));
  return grid(n, 3, (u, v) => {
    const a = a0 + u * (a1 - a0), ph = waves * (full ? u * Math.PI * 2 : a);
    const rr = r + v * (w + amp * Math.sin(ph));
    const yy = y - v * drop + v * amp * 0.8 * Math.cos(ph);
    return V3(rr * Math.sin(a), yy, rr * Math.cos(a) * zs);
  });
}

function bow(size, color, tails = false) {
  const g = new THREE.Group();
  const lobe = new THREE.ConeGeometry(size * 0.42, size, 14).scale(1, 1, 0.38);
  for (const s of [1, -1]) {
    const m = add(g, lobe, color);
    m.rotation.z = s * Math.PI / 2; m.position.x = s * size * 0.5;
  }
  if (tails) for (const s of [1, -1]) {
    const m = add(g, new THREE.ConeGeometry(size * 0.3, size * 1.3, 12).scale(1, 1, 0.3), color);
    m.position.set(s * size * 0.28, -size * 0.62, -size * 0.05); m.rotation.z = s * 0.38;
  }
  add(g, sphere(size * 0.17, size * 0.2, size * 0.15, 14), color);
  return g;
}

// =====================================================================
//  BODY
// =====================================================================
const body = new THREE.Group(); body.name = 'Body'; character.add(body);

// legs (white stockings) + shoes
const legGeo = lathe([[0.001, 0.05], [0.03, 0.06], [0.031, 0.1], [0.045, 0.24], [0.05, 0.31], [0.044, 0.41], [0.047, 0.46], [0.068, 0.66], [0.074, 0.78], [0.06, 0.86], [0.001, 0.88]], 20);
const legs = [];
for (const s of [1, -1]) {
  const leg = new THREE.Group(); leg.position.x = s * 0.072; body.add(leg); legs.push(leg);
  add(leg, legGeo, 0xfff7fa, { name: 'Leg' });
  const shoe = add(leg, sphere(0.043, 0.036, 0.092, 20), C.shoe, { name: 'Shoe' }); shoe.position.set(0, 0.036, 0.034);
  const heel = add(leg, new THREE.CylinderGeometry(0.026, 0.02, 0.05, 12), C.shoe); heel.position.set(0, 0.025, -0.03);
  const strap = add(leg, new THREE.TorusGeometry(0.036, 0.008, 8, 24), C.shoe); strap.rotation.x = Math.PI / 2; strap.position.y = 0.092;
  const sock = add(leg, sphere(0.034, 0.03, 0.06, 16), 0xfff7fa, { outline: false }); sock.position.set(0, 0.058, 0.03);
  const btn = add(leg, sphere(0.008, 0.008, 0.008, 8), C.gold, { outline: false }); btn.position.set(s * 0.037, 0.092, 0.005);
}

// skirt, petticoat, hem ruffle
const skirtProfile = [[0.345, 0.56], [0.32, 0.62], [0.25, 0.75], [0.165, 0.9], [0.1, 0.975]];
add(body, lathe(skirtProfile, 48), C.dress, { side: THREE.DoubleSide, name: 'Skirt' });
add(body, lathe([[0.33, 0.535], [0.3, 0.62], [0.1, 0.9]], 48), C.white, { side: THREE.DoubleSide, outline: false });
add(body, frill({ r: 0.335, y: 0.575, w: 0.04, drop: 0.055, waves: 30, amp: 0.012 }), C.white, { side: THREE.DoubleSide, outline: false, name: 'HemFrill' });

// apron (front), with ruffle and heart
const off = p => [p[0] + 0.007, p[1]];
add(body, lathe([[0.3, 0.66], [0.25, 0.75], [0.165, 0.9], [0.102, 0.97]].map(off), 24, -0.72, 1.44), C.white, { side: THREE.DoubleSide, outline: false, name: 'Apron' });
add(body, frill({ r: 0.3, y: 0.668, w: 0.028, drop: 0.04, waves: 34, amp: 0.009, a0: -0.74, a1: 0.74 }), C.white, { side: THREE.DoubleSide, outline: false });
{
  const sh = new THREE.Shape(); const k = 0.03;
  sh.moveTo(0, -k); sh.bezierCurveTo(-k * 1.9, k * 0.2, -k * 0.9, k * 1.5, 0, k * 0.55); sh.bezierCurveTo(k * 0.9, k * 1.5, k * 1.9, k * 0.2, 0, -k);
  const heart = add(body, new THREE.ShapeGeometry(sh, 16), new THREE.MeshBasicMaterial({ color: C.rose, side: THREE.DoubleSide }), { outline: false, name: 'Heart' });
  heart.position.set(0, 0.765, 0.262); heart.rotation.x = -0.5;
}

// torso: blouse, corset, bib, neck
const torsoProfile = [[0.09, 0.9], [0.084, 0.975], [0.094, 1.04], [0.11, 1.1], [0.117, 1.15], [0.108, 1.195], [0.07, 1.225], [0.036, 1.24]];
const ZS = 0.8;
add(body, lathe(torsoProfile, 32).scale(1, 1, ZS), C.white, { name: 'Blouse' });
for (const s of [1, -1]) { const b = add(body, sphere(0.05, 0.045, 0.04, 18), C.white, { outline: false }); b.position.set(s * 0.048, 1.115, 0.062); }
add(body, lathe([[0.103, 0.955], [0.09, 0.975], [0.1, 1.045]], 32).scale(1, 1, ZS), C.dress, { side: THREE.DoubleSide, name: 'Corset' });
add(body, new THREE.TorusGeometry(0.094, 0.009, 8, 40).rotateX(Math.PI / 2).scale(1, 1, ZS), C.rose, { outline: false }).position.y = 0.972;
for (const s of [1, -1]) for (const y of [0.995, 1.025]) {
  const b = add(body, sphere(0.007, 0.007, 0.005, 8), C.gold, { outline: false }); b.position.set(s * 0.022, y, (y > 1 ? 0.079 : 0.075));
}
// blouse pleats / suspenders
for (const s of [1, -1]) {
  const st = add(body, strand([V3(s * 0.05, 1.045, 0.074), V3(s * 0.062, 1.12, 0.097), V3(s * 0.07, 1.19, 0.06), V3(s * 0.07, 1.215, 0.0), V3(s * 0.065, 1.19, -0.06), V3(s * 0.05, 1.045, -0.078)],
    () => 0.011, { flat: 0.35, ref: V3(0, 1.1, 0), segs: 28, radial: 8 }), C.dress, { outline: false });
}
add(body, new THREE.CylinderGeometry(0.034, 0.038, 0.12, 16), C.skin, { name: 'Neck' }).position.y = 1.26;
add(body, frill({ r: 0.04, y: 1.243, w: 0.035, drop: 0.022, waves: 14, amp: 0.008, zs: 0.9 }), C.white, { side: THREE.DoubleSide, outline: false, name: 'Collar' });
{ const b = bow(0.075, C.rose, true); b.position.set(0, 1.205, 0.088); b.rotation.x = -0.15; b.userData.rigid = 'Chest'; body.add(b); }
{ const b = bow(0.2, C.white, true); b.position.set(0, 0.975, -0.105); b.rotation.x = 0.25; b.name = 'BackBow'; b.userData.rigid = 'Spine'; body.add(b); }

// arms (local -Y runs from the shoulder to the hand)
const ELBOW = -0.25, WRIST = -0.5;
const arms = [];
for (const s of [1, -1]) {
  const arm = new THREE.Group(); arm.name = s > 0 ? 'ArmL' : 'ArmR';
  arm.position.set(s * 0.122, 1.185, 0); arm.rotation.z = s * 0.72; body.add(arm); arms.push(arm);
  add(arm, new THREE.CapsuleGeometry(0.028, 0.5, 6, 14), C.skin).position.y = -0.25;
  // puff sleeve sits on the shoulder joint so it stays put when the arm is raised
  const puff = add(arm, sphere(0.06, 0.054, 0.06, 18), C.white, { name: 'Puff' }); puff.position.y = -0.016;
  add(arm, frill({ r: 0.036, y: -0.06, w: 0.03, drop: 0.022, waves: 12, amp: 0.008 }), C.white, { side: THREE.DoubleSide, outline: false });
  // detached sleeve: starts at the elbow and follows the forearm only
  const sl = new THREE.Group(); arm.add(sl); arm.userData.sleeve = sl;
  add(sl, frill({ r: 0.036, y: ELBOW + 0.012, w: 0.022, drop: -0.016, waves: 12, amp: 0.006 }), C.white, { side: THREE.DoubleSide, outline: false });
  add(sl, new THREE.TorusGeometry(0.037, 0.007, 8, 24).rotateX(Math.PI / 2), C.rose, { outline: false }).position.y = ELBOW + 0.012;
  add(sl, lathe([[0.1, -0.5], [0.088, -0.435], [0.06, -0.33], [0.042, -0.265], [0.037, ELBOW + 0.012]], 28), C.dress, { side: THREE.DoubleSide, name: 'Sleeve' });
  add(sl, frill({ r: 0.098, y: -0.495, w: 0.026, drop: 0.04, waves: 18, amp: 0.01 }), C.white, { side: THREE.DoubleSide, outline: false });
  // hand
  const hand = add(arm, sphere(0.027, 0.044, 0.016, 16), C.skin, { name: 'Hand' }); hand.position.y = -0.535;
  const thumb = add(arm, new THREE.CapsuleGeometry(0.008, 0.026, 4, 8), C.skin); thumb.position.set(0, -0.52, 0.022); thumb.rotation.x = -0.5;
  for (let i = 0; i < 4; i++) {
    const f = add(arm, new THREE.CapsuleGeometry(0.0065, 0.03 - Math.abs(i - 1.4) * 0.004, 4, 8), C.skin, { outline: false });
    f.position.set(0, -0.582, -0.0125 + i * 0.0085); f.rotation.x = (i - 1.5) * 0.07;
  }
}

// cat tail
const tailPivot = new THREE.Group(); tailPivot.position.set(0, 0.8, -0.12); tailPivot.name = 'Tail'; body.add(tailPivot);
add(tailPivot, strand([V3(0, 0, 0), V3(0, -0.14, -0.14), V3(0.03, -0.2, -0.32), V3(0.08, -0.1, -0.45), V3(0.09, 0.07, -0.48), V3(0.05, 0.19, -0.44)],
  v => 0.024 * (v > 0.9 ? Math.sqrt(Math.max(0, 1 - ((v - 0.9) / 0.1) ** 2)) : 1) + 0.0005, { ref: V3(0, 0.3, -0.2), segs: 36, radial: 12 }), C.hair);

// =====================================================================
//  HEAD
// =====================================================================
const R = 0.155;
const head = new THREE.Group(); head.name = 'Head'; head.position.set(0, 1.445, 0); head.scale.setScalar(1.1); character.add(head);
// smooth curve through [x, y] knots (x ascending)
function curve1(pts) {
  const n = pts.length, m = pts.map((_, i) => { const a = pts[Math.max(0, i - 1)], b = pts[Math.min(n - 1, i + 1)]; return (b[1] - a[1]) / (b[0] - a[0]); });
  return x => {
    let i = 0; while (i < n - 2 && x > pts[i + 1][0]) i++;
    const [x0, y0] = pts[i], [x1, y1] = pts[i + 1], h = x1 - x0, t = Math.min(1, Math.max(0, (x - x0) / h)), t2 = t * t, t3 = t2 * t;
    return (2 * t3 - 3 * t2 + 1) * y0 + (t3 - 2 * t2 + t) * h * m[i] + (-2 * t3 + 3 * t2) * y1 + (t3 - t2) * h * m[i + 1];
  };
}
// head = ellipsoid reshaped per height (in R units: crown = 1, chin tip = -1.1):
// full cheeks down to mouth level, then a jaw that turns in to a small chin
const Wm = curve1([[-1.1, 0.36], [-1.02, 0.46], [-0.92, 0.62], [-0.78, 0.84], [-0.62, 0.97], [-0.45, 1.01], [-0.25, 1.0], [0, 1.0], [0.5, 1.02], [1, 1.0]]);
const Fm = curve1([[-1.1, 0.6], [-1.02, 0.74], [-0.92, 0.85], [-0.78, 0.85], [-0.62, 0.9], [-0.45, 0.92], [-0.2, 0.9], [0.1, 0.94], [0.5, 0.97], [1, 0.95]]);
const Bm = curve1([[-1.1, 0.4], [-0.92, 0.55], [-0.78, 0.7], [-0.62, 0.85], [-0.45, 0.95], [-0.2, 1.03], [1, 1.03]]);
const Zc = curve1([[-1.1, 0.42], [-0.95, 0.32], [-0.8, 0.2], [-0.6, 0.08], [-0.35, 0], [1, 0]]);
const spow = (v, e) => Math.sign(v) * Math.pow(Math.abs(v), e);
function headPoint(a, phi) {                                 // a: azimuth from +z towards +x, phi: 0 crown .. PI chin
  const yn = -0.05 + 1.05 * Math.cos(phi), sn = Math.sin(phi), ca = Math.cos(a);
  const x = sn * Wm(yn) * spow(Math.sin(a), 0.9);
  let z = Zc(yn) + sn * (ca >= 0 ? Fm(yn) : Bm(yn)) * spow(ca, 0.9);
  if (ca > 0) { const dx = x / 0.065, dy = (yn + 0.52) / 0.085; z += 0.075 * Math.exp(-(dx * dx + dy * dy)); }   // nose
  return V3(x * R, yn * R, z * R);
}
add(head, grid(72, 52, (u, v) => headPoint((u - 0.5) * Math.PI * 2, 0.0005 + v * (Math.PI - 0.001)), true), C.skin, { name: 'Face' });

// face texture (eyes, brows, mouth, blush), projected from the front:
// canvas spans x in [-R, R], y in [-1.15R, 0.45R], 500 px per R
const LASH = '#40242f';
function drawEye(x, cx, cy, d, closed) {
  const ell = (ex, ey, rx, ry) => { x.beginPath(); x.ellipse(ex, ey, rx, ry, 0, 0, Math.PI * 2); };
  x.save(); x.translate(cx, cy); x.scale(d * 1.06, 1.0);           // +x is the outer side of the eye
  // blush
  const bl = x.createRadialGradient(30, 150, 4, 30, 150, 80);
  bl.addColorStop(0, 'rgba(255,125,150,.5)'); bl.addColorStop(1, 'rgba(255,125,150,0)');
  x.save(); x.translate(0, 150 * 0.55); x.scale(1, 0.45); x.fillStyle = bl; ell(30, 150, 80, 80); x.fill(); x.restore();
  x.strokeStyle = 'rgba(240,110,140,.55)'; x.lineWidth = 3.5;
  for (const o of [8, 30, 52]) { x.beginPath(); x.moveTo(o + 7, 140); x.lineTo(o - 5, 162); x.stroke(); }
  // brow
  x.strokeStyle = '#c66f94'; x.lineWidth = 6.5; x.beginPath(); x.moveTo(-58, -168); x.quadraticCurveTo(10, -188, 86, -160); x.stroke();
  if (closed) {
    x.strokeStyle = LASH; x.lineWidth = 13; x.beginPath(); x.moveTo(-90, 6); x.quadraticCurveTo(0, 60, 92, 2); x.stroke();
    x.lineWidth = 8; x.beginPath(); x.moveTo(90, 4); x.lineTo(114, -8); x.stroke();
    x.restore(); return;
  }
  // eyeball
  x.save(); x.beginPath(); x.moveTo(-88, 10);
  x.bezierCurveTo(-80, -70, -45, -100, 0, -100); x.bezierCurveTo(45, -100, 72, -85, 85, -55);
  x.bezierCurveTo(95, -20, 92, 15, 80, 40); x.bezierCurveTo(62, 92, 10, 108, -45, 96); x.bezierCurveTo(-80, 84, -92, 50, -88, 10);
  x.closePath(); x.clip();
  x.fillStyle = '#fffaf9'; x.fillRect(-110, -120, 220, 240);
  const ig = x.createLinearGradient(0, -100, 0, 104);
  ig.addColorStop(0, '#083f37'); ig.addColorStop(0.42, '#119e7f'); ig.addColorStop(0.78, '#4fdcae'); ig.addColorStop(1, '#b4fbe0');
  x.fillStyle = ig; ell(2, 4, 73, 101); x.fill();
  x.strokeStyle = 'rgba(5,46,40,.7)'; x.lineWidth = 7; ell(2, 4, 70, 98); x.stroke();
  x.fillStyle = '#052e28'; ell(2, -4, 28, 46); x.fill();
  x.fillStyle = 'rgba(215,255,240,.5)'; ell(2, 58, 42, 26); x.fill();
  const sh = x.createLinearGradient(0, -100, 0, -20);
