<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Буль — морская губка 3D</title>
<style>
  html, body { margin: 0; height: 100%; overflow: hidden; background: #0b4f7a; font-family: system-ui, sans-serif; }
  canvas { display: block; }
  #hint {
    position: fixed; left: 0; right: 0; bottom: 16px; text-align: center;
    color: #e8f7ff; font-size: 14px; text-shadow: 0 1px 4px rgba(0,0,0,.5); pointer-events: none;
  }
  #title {
    position: fixed; top: 16px; left: 0; right: 0; text-align: center;
    color: #fff; font-size: 22px; font-weight: 700; text-shadow: 0 2px 6px rgba(0,0,0,.45); pointer-events: none;
  }
</style>
<script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script>
</head>
<body>
<div id="title">Буль, морская губка</div>
<div id="hint">Тяни мышкой или пальцем — вращение · колёсико — масштаб · клик по Булю — прыжок</div>
<script type="module">
import * as THREE from 'three';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js';

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.shadowMap.enabled = true;
renderer.shadowMap.type = THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0e6a9c);
scene.fog = new THREE.Fog(0x0e6a9c, 12, 32);

const camera = new THREE.PerspectiveCamera(42, innerWidth / innerHeight, 0.1, 100);
camera.position.set(3.2, 2.6, 8.5);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0, 1.9, 0);
controls.enableDamping = true;
controls.minDistance = 4;
controls.maxDistance = 16;
controls.maxPolarAngle = Math.PI / 2 - 0.03;

// ---------- свет ----------
scene.add(new THREE.HemisphereLight(0xbfeaff, 0x2a5d4e, 1.1));
const sun = new THREE.DirectionalLight(0xffffff, 1.9);
sun.position.set(4, 9, 6);
sun.castShadow = true;
sun.shadow.mapSize.set(2048, 2048);
sun.shadow.camera.left = -6; sun.shadow.camera.right = 6;
sun.shadow.camera.top = 6; sun.shadow.camera.bottom = -6;
scene.add(sun);
const rim = new THREE.DirectionalLight(0x7fd6ff, 0.7);
rim.position.set(-5, 3, -6);
scene.add(rim);

// ---------- материалы ----------
const mat = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, ...o });
const M = {
  body: mat(0xff7f5c, { roughness: 0.9 }),
  pore: mat(0xd9583a, { roughness: 1 }),
  white: mat(0xffffff, { roughness: 0.3 }),
  iris: mat(0x2fae7a, { roughness: 0.3 }),
  black: mat(0x1b1b22, { roughness: 0.4 }),
  cheek: mat(0xff5d7a),
  mouth: mat(0x7a1f2b),
  tongue: mat(0xff8fa3),
  ringA: mat(0x1fb6c9, { roughness: 0.45 }),
  ringB: mat(0xffffff, { roughness: 0.45 }),
  shoe: mat(0x6a4cff, { roughness: 0.5 }),
  sole: mat(0xffffff),
  cap: mat(0xffffff, { roughness: 0.6 }),
  capBand: mat(0x1e3a8a),
  sand: mat(0xe9d39a, { roughness: 1 }),
};

const mesh = (geo, material, parent, x = 0, y = 0, z = 0) => {
  const m = new THREE.Mesh(geo, material);
  m.position.set(x, y, z);
  m.castShadow = true;
  m.receiveShadow = true;
  parent.add(m);
  return m;
};

// ---------- персонаж ----------
const hero = new THREE.Group();
scene.add(hero);

const torso = new THREE.Group();
torso.position.y = 2.25;
hero.add(torso);

// тело: высокий скруглённый «бочонок»
const W = 1.9, H = 2.5, D = 1.15;
mesh(new RoundedBoxGeometry(W, H, D, 8, 0.42), M.body, torso);

// поры по всему телу
const poreGeo = new THREE.SphereGeometry(1, 16, 12);
const rnd = (a, b) => a + Math.random() * (b - a);
const pores = [
  // спереди (в стороне от лица)
  [-0.72, 0.95, 1], [0.7, 1.0, 1], [-0.78, -0.2, 1], [0.8, -0.05, 1], [0.05, 1.05, 1],
  // сзади
  ...Array.from({ length: 12 }, () => [rnd(-0.75, 0.75), rnd(-0.3, 1.05), -1]),
];
for (const [x, y, side] of pores) {
  const r = rnd(0.07, 0.15);
  const p = mesh(poreGeo, M.pore, torso, x, y, side * (D / 2 - 0.01));
  p.scale.set(r, r * rnd(0.8, 1.2), 0.02);
  p.castShadow = false;
}
for (const sx of [-1, 1]) for (let i = 0; i < 4; i++) {
  const r = rnd(0.07, 0.13);
  const p = mesh(poreGeo, M.pore, torso, sx * (W / 2 - 0.01), rnd(-0.2, 1.0), rnd(-0.3, 0.3));
  p.scale.set(0.02, r, r);
  p.castShadow = false;
}

// глаза
const face = new THREE.Group();
face.position.set(0, 0.45, D / 2);
torso.add(face);
const eyes = [];
for (const sx of [-1, 1]) {
  const eye = new THREE.Group();
  eye.position.set(sx * 0.4, 0.12, 0.02);
  face.add(eye);
  const ball = mesh(new THREE.SphereGeometry(0.33, 32, 24), M.white, eye);
  ball.scale.z = 0.55;
  const iris = mesh(new THREE.SphereGeometry(0.15, 24, 16), M.iris, eye, -sx * 0.04, -0.02, 0.15);
  iris.scale.z = 0.4;
  const pupil = mesh(new THREE.SphereGeometry(0.08, 24, 16), M.black, eye, -sx * 0.04, -0.02, 0.2);
  pupil.scale.z = 0.4;
  const glint = mesh(new THREE.SphereGeometry(0.03, 12, 8), M.white, eye, -sx * 0.04 + 0.05, 0.04, 0.23);
  glint.castShadow = false;
  // бровь
  const brow = mesh(new THREE.CapsuleGeometry(0.035, 0.26, 6, 12), M.black, face, sx * 0.42, 0.56, 0.02);
  brow.rotation.z = Math.PI / 2 - sx * 0.2;
  eyes.push(eye);
}

// щёки
for (const sx of [-1, 1]) {
  const c = mesh(new THREE.SphereGeometry(0.13, 20, 14), M.cheek, face, sx * 0.68, -0.28, -0.02);
  c.scale.z = 0.3;
  c.castShadow = false;
}

// улыбка: открытый рот-полумесяц с язычком
const mouthShape = new THREE.Shape();
mouthShape.moveTo(-0.38, 0);
mouthShape.quadraticCurveTo(0, 0.08, 0.38, 0);
mouthShape.quadraticCurveTo(0, -0.5, -0.38, 0);
const mouth = mesh(new THREE.ShapeGeometry(mouthShape, 24), M.mouth, face, 0, -0.38, 0.012);
mouth.castShadow = false;
const tongue = mesh(new THREE.CircleGeometry(0.12, 24), M.tongue, face, 0, -0.55, 0.016);
tongue.scale.set(1.2, 0.6, 1);
tongue.castShadow = false;

// плавательный круг на поясе
const ring = new THREE.Group();
ring.position.y = -0.78;
ring.scale.set(1.0, 1, 0.68);
torso.add(ring);
const SEG = 12;
for (let i = 0; i < SEG; i++) {
  const g = new THREE.TorusGeometry(1.12, 0.27, 20, 12, (Math.PI * 2) / SEG + 0.01);
  const seg = mesh(g, i % 2 ? M.ringA : M.ringB, ring);
  seg.rotation.x = Math.PI / 2;
  seg.rotation.z = (i * Math.PI * 2) / SEG;
}

// морская кепка-бескозырка
const cap = new THREE.Group();
cap.position.set(0.25, H / 2 + 0.02, 0);
cap.rotation.z = -0.16;
torso.add(cap);
mesh(new THREE.CylinderGeometry(0.42, 0.42, 0.14, 32), M.capBand, cap, 0, 0.07, 0);
mesh(new THREE.CylinderGeometry(0.62, 0.44, 0.2, 32), M.cap, cap, 0, 0.24, 0);
mesh(new THREE.SphereGeometry(0.07, 16, 12), M.capBand, cap, 0, 0.37, 0);

// руки
function makeArm(sx) {
  const shoulder = new THREE.Group();
  shoulder.position.set(sx * (W / 2 - 0.05), 0.0, 0);
  torso.add(shoulder);
  mesh(new THREE.CapsuleGeometry(0.085, 0.85, 6, 14), M.body, shoulder, 0, -0.5, 0);
  const hand = mesh(new THREE.SphereGeometry(0.17, 20, 16), M.body, shoulder, 0, -1.02, 0);
  for (let i = -1; i <= 1; i++) {
    const f = mesh(new THREE.CapsuleGeometry(0.045, 0.1, 4, 8), M.body, hand, i * 0.09, -0.17, 0);
    f.rotation.z = i * 0.35;
  }
  return shoulder;
}
const armL = makeArm(-1), armR = makeArm(1);
armL.rotation.z = -0.5;

// ноги
function makeLeg(sx) {
  const hip = new THREE.Group();
  hip.position.set(sx * 0.42, 2.25 - H / 2 + 0.1, 0);
  hero.add(hip);
  mesh(new THREE.CapsuleGeometry(0.09, 0.75, 6, 14), M.body, hip, 0, -0.45, 0);
  const shoe = mesh(new THREE.SphereGeometry(0.26, 24, 16), M.shoe, hip, 0, -0.92, 0.12);
  shoe.scale.set(1, 0.7, 1.5);
  const sole = mesh(new THREE.CylinderGeometry(0.27, 0.27, 0.07, 24), M.sole, hip, 0, -1.07, 0.12);
  sole.scale.set(1, 1, 1.5);
  return hip;
}
const legL = makeLeg(-1), legR = makeLeg(1);

// ---------- окружение ----------
const ground = new THREE.Mesh(new THREE.CircleGeometry(30, 64), M.sand);
ground.rotation.x = -Math.PI / 2;
ground.receiveShadow = true;
scene.add(ground);

// камни и водоросли
const rockMat = mat(0x6f7f8c, { roughness: 1, flatShading: true });
for (const [x, z, s] of [[-3.2, -1.5, 0.7], [3.6, -2.2, 1.0], [-4.5, 2.0, 0.5], [2.6, 2.8, 0.4]]) {
  const r = mesh(new THREE.DodecahedronGeometry(s, 0), rockMat, scene, x, s * 0.45, z);
  r.scale.y = 0.7; r.rotation.y = x;
}
const weeds = [];
const weedMat = mat(0x2fbf71, { side: THREE.DoubleSide });
for (const [x, z] of [[-3.6, -0.6], [-2.6, -2.4], [3.9, -0.9], [4.4, -3.0], [-5, 1.2]]) {
  const g = new THREE.Group();
  g.position.set(x, 0, z);
  for (let i = 0; i < 4; i++) {
    const h = rnd(1.2, 2.4);
    const geo = new THREE.PlaneGeometry(0.22, h, 1, 10);
    geo.translate(0, h / 2, 0);
    const blade = mesh(geo, weedMat, g, rnd(-0.25, 0.25), 0, rnd(-0.25, 0.25));
    blade.rotation.y = rnd(0, Math.PI);
    blade.userData = { h, phase: rnd(0, 6), base: geo.attributes.position.array.slice() };
    weeds.push(blade);
  }
  scene.add(g);
}

// пузырьки
const bubbleMat = new THREE.MeshStandardMaterial({ color: 0xffffff, transparent: true, opacity: 0.35, roughness: 0.1 });
const bubbles = [];
for (let i = 0; i < 45; i++) {
  const b = new THREE.Mesh(new THREE.SphereGeometry(rnd(0.04, 0.14), 12, 10), bubbleMat);
  b.position.set(rnd(-8, 8), rnd(0, 9), rnd(-8, 4));
  b.userData = { v: rnd(0.4, 1.1), phase: rnd(0, 6) };
  scene.add(b);
  bubbles.push(b);
}

// ---------- взаимодействие ----------
let jumpT = -1;
const ray = new THREE.Raycaster(), ptr = new THREE.Vector2();
let downAt = null;
renderer.domElement.addEventListener('pointerdown', e => { downAt = [e.clientX, e.clientY]; });
renderer.domElement.addEventListener('pointerup', e => {
  if (!downAt || Math.hypot(e.clientX - downAt[0], e.clientY - downAt[1]) > 6) return;
  ptr.set((e.clientX / innerWidth) * 2 - 1, -(e.clientY / innerHeight) * 2 + 1);
  ray.setFromCamera(ptr, camera);
  if (ray.intersectObject(hero, true).length && jumpT < 0) jumpT = 0;
});

addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ---------- анимация ----------
const clock = new THREE.Clock();
function tick() {
  const dt = Math.min(clock.getDelta(), 0.05);
  const t = clock.elapsedTime;

  // дыхание и покачивание
  torso.position.y = 2.25 + Math.sin(t * 2) * 0.04;
  torso.rotation.z = Math.sin(t * 1.3) * 0.035;
  torso.scale.set(1 + Math.sin(t * 2) * 0.012, 1 - Math.sin(t * 2) * 0.012, 1);

  // правая рука машет, левая покачивается
  armR.rotation.z = 2.35 + Math.sin(t * 6) * 0.35;
  armL.rotation.z = -0.5 + Math.sin(t * 2) * 0.08;
  armL.rotation.x = Math.sin(t * 1.5) * 0.12;

  // моргание
  const blink = (t % 3.4) < 0.13 ? 0.08 : 1;
  for (const e of eyes) e.scale.y += (blink - e.scale.y) * 0.5;

  // прыжок по клику
  let y = 0;
  if (jumpT >= 0) {
    jumpT += dt;
    const p = jumpT / 0.8;
    if (p >= 1) { jumpT = -1; hero.rotation.y = 0; }
    else {
      y = Math.sin(p * Math.PI) * 1.4;
      hero.rotation.y = p * Math.PI * 2;
      const kick = Math.sin(p * Math.PI) * 0.7;
      legL.rotation.z = -kick; legR.rotation.z = kick;
    }
  }
  if (jumpT < 0) { legL.rotation.z *= 0.8; legR.rotation.z *= 0.8; }
  hero.position.y = y;

  // водоросли
  for (const w of weeds) {
    const pos = w.geometry.attributes.position, { h, phase, base } = w.userData;
    for (let i = 0; i < pos.count; i++) {
      const k = base[i * 3 + 1] / h;
      pos.array[i * 3] = base[i * 3] + Math.sin(t * 1.4 + phase + k * 3) * 0.22 * k;
    }
    pos.needsUpdate = true;
  }

  // пузырьки
  for (const b of bubbles) {
    b.position.y += b.userData.v * dt;
    b.position.x += Math.sin(t * 2 + b.userData.phase) * 0.004;
    if (b.position.y > 9.5) b.position.y = 0;
  }

  controls.update();
  renderer.render(scene, camera);
  requestAnimationFrame(tick);
}
tick();
</script>
</body>
</html>
