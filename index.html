<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<title>Klukva Key Manager</title>
<script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-900 text-white min-h-screen p-8">
<div class="max-w-4xl mx-auto">
  <h1 class="text-3xl font-bold mb-6">Klukva Key Manager</h1>
  
  <div class="bg-gray-800 rounded-lg p-6 mb-6">
    <label class="block text-sm text-gray-400 mb-2">Admin Token</label>
    <input id="token" type="password" placeholder="klukva_admin_2024_x7K9mP2qR5" 
           class="w-full p-3 bg-gray-700 border border-gray-600 rounded focus:ring-2 focus:ring-green-500 focus:border-transparent outline-none"
           value="klukva_admin_2024_x7K9mP2qR5">
  </div>

  <div class="bg-gray-800 rounded-lg p-6 mb-6">
    <div class="flex flex-col sm:flex-row gap-3 mb-4">
      <input id="days" type="number" value="30" min="1" max="365" 
             class="w-32 p-3 bg-gray-700 border border-gray-600 rounded focus:ring-2 focus:ring-green-500 outline-none" placeholder="Days">
      <input id="note" type="text" placeholder="Note (user, vip, test...)" 
             class="flex-1 p-3 bg-gray-700 border border-gray-600 rounded focus:ring-2 focus:ring-green-500 outline-none">
      <button id="btnCreate" class="bg-green-600 hover:bg-green-700 px-6 py-3 rounded font-medium transition">Создать ключ</button>
    </div>
    <div id="result" class="text-sm text-green-400 min-h-[20px]"></div>
  </div>

  <div class="bg-gray-800 rounded-lg p-6">
    <div class="flex justify-between items-center mb-4">
      <h2 class="text-xl font-semibold">Список ключей</h2>
      <button id="btnRefresh" class="text-sm text-gray-400 hover:text-white">Обновить</button>
    </div>
    <div id="keys" class="space-y-2 max-h-96 overflow-y-auto"></div>
  </div>
</div>

<script>
// === ЯВНО ВЫНОСИМ В window ===
const API = 'https://keys-b.onrender.com';

function hdrs() {
  return { 'x-admin-token': document.getElementById('token').value, 'Content-Type': 'application/json' };
}

function showResult(msg, isError = false) {
  const el = document.getElementById('result');
  el.textContent = msg;
  el.className = 'text-sm ' + (isError ? 'text-red-400' : 'text-green-400');
}

async function loadKeys() {
  try {
    const res = await fetch(API + '/api/admin/keys', { headers: hdrs() });
    if (res.status === 401) { showResult('❌ Неверный токен', true); return; }
    if (!res.ok) { showResult('❌ Ошибка: ' + res.status, true); return; }
    const keys = await res.json();
    renderKeys(keys);
  } catch (e) { showResult('❌ Ошибка: ' + e.message, true); }
}

function renderKeys(keys) {
  const container = document.getElementById('keys');
  if (Object.keys(keys).length === 0) {
    container.innerHTML = '<p class="text-gray-500 text-center py-8">Ключей нет</p>';
    return;
  }
  container.innerHTML = Object.entries(keys).map(([k, v]) => `
    <div class="flex flex-col sm:flex-row sm:items-center gap-3 p-3 bg-gray-700 rounded border border-gray-600">
      <code class="flex-1 text-sm break-all select-all" onclick="this.select()">${k}</code>
      <span class="text-xs text-gray-400 whitespace-nowrap">Создан: ${new Date(v.created).toLocaleString()}</span>
      <span class="text-xs ${v.used ? 'text-green-400' : 'text-yellow-400'} whitespace-nowrap">${v.used ? '✅ Использован' : '🟢 Новый'}</span>
      ${v.hwid ? `<span class="text-xs text-gray-500 whitespace-nowrap">HWID: ${v.hwid.slice(0,12)}...</span>` : ''}
      <button onclick="window.delKey('${k}')" class="text-red-400 hover:text-red-300 text-sm">Удалить</button>
    </div>
  `).join('');
}

async function createKey() {
  showResult('⏳ Создание...');
  try {
    const res = await fetch(API + '/api/admin/key', {
      method: 'POST',
      headers: hdrs(),
      body: JSON.stringify({ days: parseInt(document.getElementById('days').value), note: document.getElementById('note').value })
    });
    const data = await res.json();
    if (!res.ok) { showResult('❌ ' + (data.error || res.status), true); return; }
    showResult('✅ Ключ создан: ' + data.key);
    document.getElementById('note').value = '';
    loadKeys();
  } catch (e) { showResult('❌ Ошибка: ' + e.message, true); }
}

async function delKey(key) {
  if (!confirm('Удалить ключ?')) return;
  try {
    await fetch(API + '/api/admin/key/' + key, { method: 'DELETE', headers: hdrs() });
    loadKeys();
  } catch (e) { showResult('❌ Ошибка: ' + e.message, true); }
}

// ПРИВЯЗЫВАЕМ К window ДЛЯ onclick
window.createKey = createKey;
window.delKey = delKey;
window.loadKeys = loadKeys;

// ИНИТ ЧЕРЕЗ СОБЫТИЯ (не inline onclick)
document.getElementById('btnCreate').addEventListener('click', createKey);
document.getElementById('btnRefresh').addEventListener('click', loadKeys);

// СТАРТ
loadKeys();
</script>
</body>
</html>
